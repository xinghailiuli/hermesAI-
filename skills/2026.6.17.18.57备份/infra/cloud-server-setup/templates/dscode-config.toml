# DeepSeekCode project configuration
# 使用本地 API 中转站
model.base_url = "http://localhost:8848/v1"
model.model = "deepseek-chat"
model.preset = "auto"
model.api_key_env = "DEEPSEEK_API_KEY"
model.reasoning_effort = "off"
model.tool_schema_flattening = "auto"
model.session_budget_microusd = 0

# Vision model (optional, requires OpenAI-compatible vision model)
vision.base_url = "https://api.openai.com/v1"
vision.model = "gpt-4.1"
vision.api_key_env = "OPENAI_API_KEY"

approval.require_write_confirmation = true
approval.require_shell_confirmation = true
approval.require_mcp_confirmation = true
approval.mcp_call_allowlist = []

workspace.config_dir = ".dscode"
workspace.session_dir = ".dscode/sessions"
workspace.user_skills_dir = "~/.config/dscode/skills"
workspace.user_commands_dir = "~/.config/dscode/commands"
workspace.user_instructions_file = "~/.config/dscode/AGENTS.md"

hooks.enabled = false
hooks.project_dir = ".dscode/hooks"
hooks.user_dir = "~/.config/dscode/hooks"
hooks.timeout_ms = 5000

mcp.enabled = true
mcp.expose_remote_tools = false
mcp.project_file = ".dscode/mcp.json"
mcp.user_file = "~/.config/dscode/mcp.json"

diagnostics.post_edit = false

runtime.daemon_compaction_threshold_tokens = 800000
runtime.daemon_compaction_keep_tail_turns = 8

memory.enabled = false
memory.notes_path = "~/.config/dscode/notes.md"
memory.memory_path = "~/.config/dscode/memory.md"

network.default = "allow"
network.allow = []
network.deny = []
network.audit = true
network.audit_path = "~/.config/dscode/network-audit.log"

skills.registry_url = "https://raw.githubusercontent.com/Hmbown/deepseek-skills/main/index.json"
skills.cache_dir = "~/.cache/dscode/skills"
