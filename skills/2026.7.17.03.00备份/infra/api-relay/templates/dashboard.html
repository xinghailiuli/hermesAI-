<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Relay Dashboard</title>
<style>
:root{--bg:#1a1a2e;--card:#16213e;--accent:#0f3460;--text:#eee;--green:#00c853;--red:#ff1744;--blue:#448aff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;min-height:100vh}
h1{text-align:center;margin-bottom:20px;font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--accent)}
.card h3{margin-bottom:8px;font-size:1rem}
.status{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.on{background:var(--green)}.off{background:var(--red)}
.toggle{padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-size:0.8rem;color:#fff}
.toggle.on{background:var(--green)}.toggle.off{background:var(--red)}
.info{font-size:0.75rem;color:#888;margin-top:4px}
.chat-box{margin-top:20px;max-width:800px;margin-left:auto;margin-right:auto}
.chat-box textarea{width:100%;height:60px;background:var(--card);color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:8px;resize:vertical}
.chat-box select,.chat-box button{padding:6px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--text);cursor:pointer;margin:4px}
.chat-box button:hover{opacity:0.8}
#chatOutput{background:var(--card);border-radius:8px;padding:12px;margin-top:8px;min-height:40px;white-space:pre-wrap;font-size:0.9rem}
</style>
</head>
<body>
<h1>API Relay Dashboard</h1>
<div class="grid" id="modelGrid">Loading...</div>
<div class="chat-box">
  <select id="chatModel"><option>deepseek-chat</option></select>
  <button onclick="sendChat()">Test</button>
  <textarea id="chatInput" placeholder="Hello!">hi</textarea>
  <div id="chatOutput"></div>
</div>
<script>
const TOKEN='sk-local-apirelay-2026';
async function loadAll(){
  try{
    const h=await fetch('/health');const hd=await h.json();
    document.getElementById('modelGrid').innerHTML='<div class="card"><h3>Service Status</h3><p>'+hd.status+' | '+hd.models+' models</p></div>';
    const r=await fetch('/v1/models',{headers:{'Authorization':'Bearer '+TOKEN}});
    const d=await r.json();
    for(const m of d.data){
      document.getElementById('modelGrid').innerHTML+='<div class="card"><h3><span class="status on"></span>'+m.id+'</h3><p class="info">'+m.owned_by+'</p></div>';
    }
    const s=await fetch('/stats',{headers:{'Authorization':'Bearer '+TOKEN}});
    const sd=await s.json();
    document.getElementById('modelGrid').innerHTML+='<div class="card"><h3>Stats</h3><p>Requests: '+(sd.total_requests||0)+' | Tokens: '+(sd.total_tokens||0)+'</p></div>';
  }catch(e){document.getElementById('modelGrid').innerHTML='<p style="color:red">'+e.message+'</p>';}
}
async function sendChat(){
  const model=document.getElementById('chatModel').value;
  const input=document.getElementById('chatInput').value;
  document.getElementById('chatOutput').textContent='...';
  try{
    const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({model,messages:[{role:'user',content:input}],max_tokens:200})});
    const d=await r.json();
    document.getElementById('chatOutput').textContent=d.choices?d.choices[0].message.content:JSON.stringify(d,null,2);
  }catch(e){document.getElementById('chatOutput').textContent='Error: '+e.message;}
}
loadAll();
</script>
</body>
</html>
