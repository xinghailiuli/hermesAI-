# Minimal mihomo config — ZERO geodata dependencies
# This config works on GFW-blocked servers where MMDB download is impossible.
# Use this when the full subscription config triggers "Can't find MMDB, start download" hang.

mode: global
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: true

# Critical: prevent mihomo from trying to download geodata from GitHub
geodata-mode: false
geox-url:
  mmdb: ""
  geoip: ""
  geosite: ""

# Disable DNS (let system resolver handle it through the proxy)
dns:
  enable: false
tun:
  enable: false

# Paste your vmess/ss/trojan nodes here
proxies:
- name: Node-Name-Here
  type: vmess
  server: your.server.com
  port: 443
  uuid: your-uuid-here
  alterId: 0
  cipher: auto
  udp: true
  tls: true
  skip-cert-verify: true
  servername: gw.alicdn.com

proxy-groups:
- name: Proxy
  type: select
  proxies:
  - Auto
  # List individual nodes here too for manual selection

- name: Auto
  type: url-test
  proxies:
  # List all nodes here — url-test auto-picks fastest healthy one
  - Node-Name-Here
  url: http://www.gstatic.com/generate_204
  interval: 300

# Domain-based rules only — NO GEOIP or GEOSITE rules!
# GEOIP/GEOSITE rules trigger MMDB download which hangs on GFW-blocked servers.
rules:
- DOMAIN-SUFFIX,cn,DIRECT
- DOMAIN-KEYWORD,-cn,DIRECT
- DOMAIN-KEYWORD,github,Proxy
- DOMAIN-KEYWORD,google,Proxy
- DOMAIN-KEYWORD,youtube,Proxy
- MATCH,Proxy
