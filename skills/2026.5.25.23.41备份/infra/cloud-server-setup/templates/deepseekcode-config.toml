# DeepSeekCode 配置模板
# 位置: ~/.dscode/config.toml
# 搭配本地 API 中转站 (localhost:8848)

# ============================================================
# 核心模型配置（必改）
# ============================================================
model.base_url = "http://localhost:8848/v1"     # 中转站地址
model.model = "deepseek-chat"                    # 模型名（中转站的 model id）
model.preset = "auto"
model.api_key_env = "DEEPSEEK_API_KEY"           # 环境变量名
model.reasoning_effort = "off"
model.tool_schema_flattening = "auto"
model.session_budget_microusd = 0

# ============================================================
# 环境变量（写入 ~/.bashrc）
# ============================================================
# export DEEPSEEK_API_KEY="sk-local-apirelay-2026"
# 
# 验证：
# curl -s -H "Authorization: Bearer $DEEPSEEK_API_KEY" http://localhost:8848/v1/models

# ============================================================
# Vision 模型（可选，没有视觉模型就留默认）
# ============================================================
vision.base_url = "https://api.openai.com/v1"
vision.model = "gpt-4.1"
vision.api_key_env = "OPENAI_API_KEY"

# ============================================================
# 审批与安全
# ============================================================
approval.require_write_confirmation = true
approval.require_shell_confirmation = true
approval.require_mcp_confirmation = true

# ============================================================
# 工作区
# ============================================================
workspace.config_dir = ".dscode"
workspace.session_dir = ".dscode/sessions"

# ============================================================
# 网络（只读 web/search/fetch 工具）
# ============================================================
network.default = "allow"
network.audit = true

# ============================================================
# 常用命令速查
# ============================================================
# deepseek-tui run "你的任务"       # 一次性任务
# deepseek-tui chat                 # 交互式 REPL
# deepseek-tui tui                  # 全屏终端工作台
# deepseek-tui config provider show # 查看当前配置
