onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
model:
  default: deepseek-v4-pro
  provider: custom:deepseek
auxiliary:
  compression:
    provider: custom:deepseek
    model: deepseek-chat
custom_providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    key_env: OPENAI_API_KEY
    api_mode: openai_chat